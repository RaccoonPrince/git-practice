name: Environment Variables Demo
on: workflow_dispatch
env:
  APP_NAME: MyApplication # 환경 변수 설정
jobs:
  test:
    runs-on: ubuntu-latest # 사용할 OS 환경
    env:
      APP_VERSION: "1.0"
    steps:
      - name: Print Variables # STEP1의 ID
        env:
          MESSAGE: Hello GitHub Actions
        run: |
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "Message: $MESSAGE"

      - name: Print Again # STEP2의 ID
        run: |
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "Message: $MESSAGE"
      - name: Env Overwirte # STEP3의 ID
        env:
          APP_NAME: MyApplication v2
        run: |
          echo "Application: $APP_NAME"
      - name: Default Envs # STEP4의 ID
        run: echo "$GITHUB_REPOSITORY"
  print:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "Message: $MESSAGE"


