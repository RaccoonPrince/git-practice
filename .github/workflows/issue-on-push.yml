name: Issue on Push

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for this push
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Push by ${{ github.actor }}: ${{ github.sha }}" \
            --body "Commit: $MSG"
