name: issue-comment
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  comment-with-gh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Comment with GitHub CLI
        run: |
          gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -f body="Thanks for opening this issue! (gh)" \
            --jq '.html_url'
  comment-with-curl:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Comment with curl
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -d '{"body":"Thanks for opening this issue! (curl)"}' | grep html_url
